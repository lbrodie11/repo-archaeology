name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.runner || matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        include:
          # The job that installs Playwright's system packages stays on Ubuntu 24.04: on the
          # ubuntu-latest Ubuntu 26.04 image, `playwright install --with-deps` failed because apt
          # could not resolve the Ubuntu mirrors (2026-11-11). Revisit when that image is stable.
          - os: ubuntu-latest
            node: 22
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Install Playwright Chromium for map engine browser tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI on this repository
        run: |
          node dist/cli.js --version
          node dist/cli.js scan --json
      - name: Smoke test packed tarball and schemas
        run: node scripts/smoke-pack.mjs

  smoke-pack:
    name: Smoke test tarball & schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/smoke-pack.mjs
