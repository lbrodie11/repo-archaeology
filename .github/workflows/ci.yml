name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI on this repository
        run: |
          node dist/cli.js --version
          node dist/cli.js scan --json
      - name: Smoke test the packed package
        shell: bash
        run: |
          package=$(npm pack --silent)
          install_dir=$(mktemp -d)
          npm install --prefix "$install_dir" "./$package" --no-audit --no-fund
          npm exec --prefix "$install_dir" -- repo-archaeology --version
