name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Verify, publish to npm, and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@11

      - name: Configure git for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Smoke-test release tarball
        run: node scripts/smoke-pack.mjs

      - name: Verify tag version and extract CHANGELOG section
        id: changelog
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG_NAME || "";
            const notesPath = process.env.NOTES_PATH;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expectedTag = `v${pkg.version}`;
            if (tag !== expectedTag) {
              console.error(`error: Git tag "${tag}" does not match package.json version "${expectedTag}".`);
              process.exit(1);
            }
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escapedVersion = pkg.version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const headingRe = new RegExp(`^## \\[${escapedVersion}\\](?:\\s+-\\s+(\\S+))?\\s*$`, "m");
            const match = headingRe.exec(changelog);
            if (!match) {
              console.error(`error: Could not find "## [${pkg.version}]" section in CHANGELOG.md.`);
              process.exit(1);
            }
            if (match[1] === "YYYY-MM-DD") {
              console.error(`error: CHANGELOG.md section for ${pkg.version} still has placeholder date YYYY-MM-DD.`);
              process.exit(1);
            }
            const afterHeading = changelog.slice(match.index + match[0].length);
            const nextHeading = /^## \[/m.exec(afterHeading);
            const sectionBody = (nextHeading ? afterHeading.slice(0, nextHeading.index) : afterHeading).trim();
            if (!sectionBody) {
              console.error(`error: CHANGELOG.md section for ${pkg.version} is empty.`);
              process.exit(1);
            }
            fs.writeFileSync(notesPath, `${sectionBody}\n`, "utf8");
          '

      # Publishes using npm Trusted Publishing (OIDC) via `permissions: id-token: write`.
      # No long-lived `NPM_TOKEN` secret is required when `lbrodie11/repo-archaeology`
      # (`release.yml`) is configured as a Trusted Publisher on npmjs.com.
      #
      # Token fallback (if Trusted Publishing is not yet configured on npmjs.com):
      #   1. Create a granular access token on npmjs.com with publish permission for `repo-archaeology`.
      #   2. Save it as the `NPM_TOKEN` repository secret in GitHub Settings -> Secrets and variables -> Actions.
      #   3. Uncomment the `env` block below:
      # env:
      #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release from CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file "$NOTES_PATH"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file "$NOTES_PATH" --verify-tag
          fi
