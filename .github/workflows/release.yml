name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify, extract changelog, and smoke-test tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      version: ${{ steps.prep.outputs.version }}
      is_prerelease: ${{ steps.prep.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.prep.outputs.npm_dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "error: Tagged commit $(git rev-parse HEAD) is not an ancestor of origin/main." >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure git for test fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Validate tag version and extract CHANGELOG section
        id: prep
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: |
          mkdir -p "$BUNDLE_DIR"
          node scripts/release-helper.mjs prepare \
            --tag "$TAG_NAME" \
            --notes-out "$BUNDLE_DIR/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pack and smoke-test release tarball
        shell: bash
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
        run: node scripts/smoke-pack.mjs --pack-out "$BUNDLE_DIR"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ steps.prep.outputs.version }}
          path: ${{ runner.temp }}/release-bundle/*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish verified tarball to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release helper scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22 for npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned npm CLI for OIDC Trusted Publishing
        run: npm install --global npm@11.21.2

      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release-bundle

      # Publishes the exact smoke-tested `.tgz` artifact using npm Trusted Publishing (OIDC)
      # via `permissions: id-token: write`. No long-lived `NPM_TOKEN` secret is required
      # when `lbrodie11/repo-archaeology` (`release.yml`) is configured as a Trusted Publisher
      # on npmjs.com. If a prior attempt already published this exact `.tgz` (verified by
      # matching `dist.integrity` and `dist.shasum`), publication is safely skipped so retries
      # can proceed to GitHub Release creation.
      #
      # Token fallback (if Trusted Publishing is not yet configured on npmjs.com):
      #   1. Create a granular access token on npmjs.com with publish permission for `repo-archaeology`.
      #   2. Save it as the `NPM_TOKEN` repository secret in GitHub Settings -> Secrets and variables -> Actions.
      #   3. Uncomment `NODE_AUTH_TOKEN` in the `env` block below:
      - name: Publish verified tarball to npm with provenance
        shell: bash
        env:
          BUNDLE_DIR: ${{ runner.temp }}/release-bundle
          PKG_VERSION: ${{ needs.verify.outputs.version }}
          NPM_DIST_TAG: ${{ needs.verify.outputs.npm_dist_tag }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL_NAME=$(tr -d '\r\n' < "$BUNDLE_DIR/tarball-filename.txt")
          TARBALL_PATH="$BUNDLE_DIR/$TARBALL_NAME"
          node scripts/release-helper.mjs publish-or-skip \
            --tarball "$TARBALL_PATH" \
            --name "repo-archaeology" \
            --version "$PKG_VERSION" \
            --dist-tag "$NPM_DIST_TAG"

  github-release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/release-bundle

      - name: Create or update GitHub Release from CHANGELOG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.verify.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
          NOTES_PATH: ${{ runner.temp }}/release-bundle/release-notes.md
        run: |
          PRERELEASE_FLAG=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$REPO" --title "$TAG_NAME" --notes-file "$NOTES_PATH" "${PRERELEASE_FLAG[@]}"
          else
            gh release create "$TAG_NAME" --repo "$REPO" --title "$TAG_NAME" --notes-file "$NOTES_PATH" --verify-tag "${PRERELEASE_FLAG[@]}"
          fi
